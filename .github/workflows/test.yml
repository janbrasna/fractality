name: test
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        include:
          - {os: ubuntu-22.04, node: 24}
          - {os: ubuntu-24.04, node: 25}
          - {os: windows-2022, node: 22}
          - {os: windows-2025, node: 25}
          - {os: macos-14, node: 24}
          - {os: macos-15-intel, node: 25}
          - {os: macos-26, node: 25}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ^9
          run_install: false
      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute tests
        run: pnpm test
        env:
          CI: true
          NODE_OPTIONS: '--trace-deprecation'
      - name: Build
        run: pnpm --filter "@fractality/mandelbrot" build
